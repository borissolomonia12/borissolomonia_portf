name: Deploy Portfolio

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-portfolio-boris
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: tastyapp-ff8b2
  REGION: us-central1
  REPOSITORY: portfolio
  IMAGE_NAME: portfolio-boris-app
  APP_DIR: /opt/Portfolio_Boris

jobs:
  verify-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify application
        run: |
          npm run lint
          npm test
          npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push immutable image
        run: |
          set -euo pipefail
          IMAGE_URI="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:$GITHUB_SHA"
          docker build --build-arg VITE_BASE_URL=/ --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Upload isolated compose definition
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_SSH_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          fingerprint: ${{ secrets.VM_HOST_FINGERPRINT }}
          source: secure-docker-setup/docker-compose.yml
          target: ${{ env.APP_DIR }}
          overwrite: true

      - name: Deploy only portfolio container
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_URI: ${{ env.IMAGE_URI }}
          APP_DIR: ${{ env.APP_DIR }}
          REGION: ${{ env.REGION }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_SSH_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          fingerprint: ${{ secrets.VM_HOST_FINGERPRINT }}
          envs: IMAGE_URI,APP_DIR,REGION
          command_timeout: 10m
          script: |
            set -Eeuo pipefail

            COMPOSE_FILE="$APP_DIR/secure-docker-setup/docker-compose.yml"
            PREVIOUS_IMAGE="$(docker inspect portfolio-boris-app --format '{{.Config.Image}}' 2>/dev/null || true)"

            rollback() {
              if [ -n "$PREVIOUS_IMAGE" ]; then
                echo "Deployment failed; restoring $PREVIOUS_IMAGE"
                IMAGE_URI="$PREVIOUS_IMAGE" docker compose -f "$COMPOSE_FILE" up -d --no-deps --force-recreate --wait --wait-timeout 90 portfolio-boris-app
              fi
            }
            trap rollback ERR

            test -f "$COMPOSE_FILE"
            docker network inspect web >/dev/null
            gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
            docker pull "$IMAGE_URI"
            IMAGE_URI="$IMAGE_URI" docker compose -f "$COMPOSE_FILE" config --quiet
            IMAGE_URI="$IMAGE_URI" docker compose -f "$COMPOSE_FILE" up -d --no-deps --force-recreate --wait --wait-timeout 90 portfolio-boris-app
            curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8090/healthz

            trap - ERR
            echo "Portfolio deployed: $IMAGE_URI"
