services:
  portfolio-boris-app:
    image: ${IMAGE_URI:?IMAGE_URI must reference an immutable image}
    container_name: portfolio-boris-app
    restart: unless-stopped
    networks:
      - web
    expose:
      - "80"
    ports:
      - "127.0.0.1:8090:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.30
    pids_limit: 128
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=4m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    external: true
